[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxi-python"
version = "1.0.0a1"
description = "Python library for parsing and dumping MAXI schema + records"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["maxi", "schema", "parser", "serialization", "data-format"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/maxi-format/maxi-python"
Repository = "https://github.com/maxi-format/maxi-python"
Issues = "https://github.com/maxi-format/maxi-python/issues"
Changelog = "https://github.com/maxi-format/maxi-python/releases"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/maxi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
